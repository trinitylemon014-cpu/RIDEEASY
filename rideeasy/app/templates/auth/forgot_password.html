{% extends "base.html" %}

{% block title %}Reset Password — RideEasy{% endblock %}

{% block content %}
<div class="container section">
  <div style="max-width: 440px; margin: 0 auto;">
    <div class="card">
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <div class="metadata-row" style="justify-content: center; margin-bottom: 0.35rem;">
          <span style="font-weight: 700; color: var(--color-black); text-transform: uppercase;">Recovery</span>
        </div>
        <h2>Reset Password</h2>
        <p style="font-size: 0.875rem;">Enter your registered email address to receive secure OTP verification</p>
      </div>

      <form method="POST" action="/auth/forgot-password">
        <div class="form-group">
          <label class="form-label" for="email">Account Email</label>
          <input type="email" id="email" name="email" autocomplete="email" class="form-control" placeholder="name@domain.ug" required autofocus>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Send Reset Code</button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.8125rem;">
        <a href="/auth/login" style="color: var(--color-dark-grey);">Return to Sign In</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
