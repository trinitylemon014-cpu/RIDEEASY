{% extends "base.html" %}

{% block title %}Sign In — RideEasy{% endblock %}

{% block content %}
<div class="container section">
  <div style="max-width: 480px; margin: 0 auto;">
    <div class="card">
      <div style="text-align: center; margin-bottom: 2rem;">
        <img src="/static/images/logo.png" alt="RideEasy Logo" style="height: 48px; width: auto; margin-bottom: 1rem; object-fit: contain;" onerror="this.style.display='none'">
        <div class="metadata-row" style="justify-content: center; margin-bottom: 0.35rem;">
          <span style="font-weight: 700; color: var(--color-black); text-transform: uppercase;">Authentication</span>
        </div>
        <h2>Sign In to RideEasy</h2>
        <p style="font-size: 0.875rem;">Access your passenger, driver, school, partner, or admin portal</p>
      </div>

      <form method="POST" action="/auth/login">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="name@domain.ug" value="{{ email or '' }}" required autofocus>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: baseline;">
            <label class="form-label" for="password">Password</label>
            <a href="/auth/forgot-password" style="font-size: 0.75rem; color: var(--color-medium-grey);">Forgot Password?</a>
          </div>
          <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem;">Sign In</button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; font-size: 0.8125rem;">
        Don't have an account? <a href="/auth/register" style="font-weight: 700; text-decoration: underline;">Create Account</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
